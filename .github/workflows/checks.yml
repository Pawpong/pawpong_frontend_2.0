name: 코드 검사

# PR 없이 dev 에 바로 머지하는 흐름이 있어 push 에서도 돈다.
# Vercel 빌드는 타입만 확인하고(Next 16 부터 린트를 돌리지 않음) 테스트는 돌리지 않으므로 여기서 모두 확인한다.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI 에서는 git 훅을 설치하지 않는다
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 타입 검사
        run: pnpm type-check
      - name: ESLint
        run: pnpm lint
      - name: FSD 레이어 규칙
        run: pnpm lint:fsd
      - name: 포맷
        run: pnpm format:check
      - name: 전체 테스트
        run: pnpm test
