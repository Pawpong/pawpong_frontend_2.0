name: 배포 E2E

# Vercel 이 배포를 만들면(도메인에 붙이기 전) 그 주소에 E2E 를 돌리고 결과를 커밋 상태로 남긴다.
# - main: Vercel Deployment Checks 에 이 상태를 필수로 지정해, 통과해야 pawpong.kr 로 교체된다.
# - dev: 막지는 않고 결과만 남긴다 (dev.pawpong.kr 는 이미 바뀌어 있다).
# repository_dispatch 는 기본 브랜치(dev)에 있는 이 파일로 돈다. 테스트 코드는 배포된 커밋으로 받는다.
on:
  repository_dispatch:
    types: [vercel.deployment.ready]

run-name: 배포 E2E · ${{ github.event.client_payload.git.ref }} · ${{ github.event.client_payload.git.shortSha }}

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: e2e-${{ github.event.client_payload.git.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # WebKit 과 시스템 의존성이 들어 있는 공식 이미지 — 브라우저 설치 시간을 쓰지 않는다
    # @playwright/test 를 올리면 이 태그도 같은 버전으로 올린다 (다르면 브라우저를 찾지 못해 실패한다)
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      HUSKY: '0'
    steps:
      # 이 단계가 커밋 상태를 '진행 중'으로 만들고, 잡이 끝나면 성공·실패로 바꾼다
      - uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: E2E (${{ github.event.client_payload.environment }})
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 배포 주소에 E2E
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_REVIEW_EMAIL: ${{ secrets.E2E_REVIEW_EMAIL }}
          E2E_REVIEW_PASSWORD: ${{ secrets.E2E_REVIEW_PASSWORD }}
      - name: 실패 기록 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trace-${{ github.event.client_payload.git.shortSha }}
          path: test-results/
          retention-days: 7

  # Vercel 이 실행시킨 워크플로라 GitHub 실패 메일이 아무에게도 가지 않는다 — 배포 알림과 같은 디스코드 채널로 알린다
  notify-failure:
    needs: e2e
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha }}
          sparse-checkout: ops
      - name: 디스코드 알림
        run: python3 ops/notify.py
        env:
          DEPLOY_SERVICE: web
          # 결과 칸과 제목에 그대로 표시된다 ("[preview] web 배포 E2E 실패")
          DEPLOY_STATUS: E2E 실패
          APP_ENV: ${{ github.event.client_payload.environment == 'production' && 'production' || 'preview' }}
          DEPLOY_HEALTH: ${{ github.event.client_payload.environment == 'production' && 'E2E 실패 · Deployment Checks 설정 시 pawpong.kr 교체 보류' || 'E2E 실패 · dev.pawpong.kr 에는 이미 반영됨' }}
          DEPLOY_METHOD: Vercel 배포 후 E2E
          DEPLOY_TARGET: Vercel · ${{ github.repository }}
          DEPLOY_ACTOR: GitHub Actions (배포 E2E)
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_BRANCH: ${{ github.event.client_payload.git.ref }}
          DEPLOY_COMMIT: ${{ github.event.client_payload.git.sha }}
          DEPLOY_URL: ${{ github.event.client_payload.url }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DISCORD_DEV_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEV_DEPLOY_WEBHOOK_URL }}
