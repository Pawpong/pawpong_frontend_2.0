name: 제작자 표시 검증

on:
  pull_request:
    branches: [dev, main]
    paths:
      - .github/workflows/maker-credit-check.yml
      - src/shared/config/makers.ts
      - src/shared/lib/makerCredit.ts
      - src/shared/lib/MakerCreditConsole.tsx
      - src/shared/lib/mobileApp.ts
      - src/app/layout.tsx
      - src/app/robots.ts
      - src/app/humans.txt/**
      - src/app/(main)/playground/cards/**
      - tests/share-metadata.test.cjs
      - tests/managed-deep-link.test.cjs
      - tests/growth-discovery.test.cjs
      - tests/vercel-deployment-policy.test.cjs
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: maker-credit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 린트와 타입 확인
        run: |
          pnpm exec eslint src/shared/config/makers.ts src/shared/lib/makerCredit.ts src/shared/lib/MakerCreditConsole.tsx src/shared/lib/mobileApp.ts src/app/layout.tsx src/app/robots.ts src/app/humans.txt/route.ts 'src/app/(main)/playground/cards/[cardId]/page.tsx' --max-warnings 0
          pnpm type-check
      - name: 관련 회귀 테스트
        run: node --test tests/share-metadata.test.cjs tests/managed-deep-link.test.cjs tests/growth-discovery.test.cjs tests/vercel-deployment-policy.test.cjs
      - name: 외부 API 없이 빌드
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9
